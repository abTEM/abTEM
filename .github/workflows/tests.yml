# Run the test suite with uv on every pull request and on pushes to dev/main.
# Dependencies are resolved fresh (no lock file), so breakage from new upstream
# releases surfaces here at PR time, matching what users get from pip/uv.

name: Tests

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    # Weekly run against fresh dependency resolutions (no lock file), so
    # breakage from new upstream releases surfaces even between PRs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs when a branch is force-pushed or updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for whether this run includes --runslow, so the
# `tests` job's own command and `all-tests-passed`'s summary (below) can't
# drift apart by editing one and forgetting the other. Skipped only for the
# common case (a PR into dev), to keep that feedback loop fast; included for
# PRs into main (release gate -- see the full OS matrix below), and for
# every push/schedule/workflow_dispatch run (i.e. right after something
# actually merges into dev or main, or on a manual run), so a slow-test
# regression on dev surfaces within minutes of merge rather than only in the
# weekly cron run.
env:
  RUNSLOW: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main') && 'true' || 'false' }}

jobs:
  tests:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full OS matrix only for release PRs (base = main)
        os: ${{ github.base_ref == 'main' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --group test

      - name: Run tests
        run: uv run pytest test -n auto ${{ env.RUNSLOW == 'true' && '--runslow' || '' }}

  # A single, stable check to require in branch protection. The `tests` job
  # above fans out into a differently-named check per matrix cell (e.g.
  # "ubuntu-latest / python 3.11"), and that set changes shape whenever the
  # OS or Python matrix does (1 OS x 4 Python versions for PRs into dev, 3 OS
  # x 4 Python versions for PRs into main) -- naming those individually as
  # required checks would need re-editing on every matrix change. This job
  # instead reduces the whole matrix to one pass/fail result.
  #
  # Its name is deliberately static regardless of RUNSLOW: a required-status-
  # check name that changed per run would silently stop matching in branch
  # protection. What DOES vary is reported in this job's own step summary
  # (visible right on the check, no digging into the `tests` job's raw
  # command needed) rather than baked into the name, so "All tests passed"
  # never overclaims what it means for a given run -- most importantly for
  # PRs into dev, where it does NOT mean the slow-marked tests ran at all.
  all-tests-passed:
    name: All tests passed
    needs: tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test matrix result
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "One or more test matrix jobs did not succeed (result: ${{ needs.tests.result }})."
            exit 1
          fi

      - name: Report whether slow tests were included
        run: |
          if [ "${{ env.RUNSLOW }}" = "true" ]; then
            echo "### :white_check_mark: Included \`--runslow\` -- slow-marked tests ran and passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :fast_forward: Did NOT include \`--runslow\` -- slow-marked tests were skipped (fast PR-into-dev path). This check passing does not mean the slow test suite passed." >> "$GITHUB_STEP_SUMMARY"
          fi
