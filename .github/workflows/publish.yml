# Build with uv and upload to PyPI via trusted publishing (OIDC, no token)
# when a GitHub release is published.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(grep '^__version__' abtem/_version.py | grep -oE '"[^"]+"' | tr -d '"')
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match abtem/_version.py (${PKG_VERSION})."
            echo "Did you forget to bump the version?"
            exit 1
          fi

      - name: Build release distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: ./dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      # Mandatory for trusted publishing
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/abtem/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: ./dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist/
