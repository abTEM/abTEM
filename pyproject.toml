[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "abTEM"
authors = [{name = "abTEM developers", email = "toma.susi@univie.ac.at"}]
description = "*ab*TEM: transmission electron microscopy from first principles"
readme = "README.md"
urls = {Homepage = "https://github.com/abtem/abtem"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
license = "GPL-3.0-or-later"
license-files = ["LICENCE"]

dependencies = [
    "numpy >= 2.0.0",
    "pandas",
    "matplotlib>=3.6",
    "pyfftw",
    "scipy",
    "numba",
    "dask>=2022.12.1,!=2025.12.*,!=2026.1.0,!=2026.1.1",
    "distributed",
    "zarr>=3.1",  # create_array(data=...) requires the 3.1 API
    "ase",
    "threadpoolctl",
    "tabulate",
    "ipywidgets",
    "ipympl",
    "tqdm",
]
dynamic = ["version"]

[project.optional-dependencies]
extra = [
    "pandas",
    "ipycytoscape",
    "dask-labextension",
    "bokeh",
]
gpaw = [
    "hankel",
    "sympy",
]
# The experimental Metal (MPS) backend on Apple silicon. Restricted to macOS on
# arm64, the only platform with a Metal device: elsewhere the torch wheel pulls
# in the whole CUDA stack (several GB) to back a device that cannot exist there.
# Developed against torch 2.14; 2.4 is the floor for MPS complex-valued FFTs.
mps = [
    "torch>=2.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
# Install every optional runtime extra at once. GPU packages (cupy, dask-cuda,
# torch) are intentionally excluded: their wheels are CUDA/RAPIDS-version or
# platform specific and must be installed to match the local machine (see the
# multi-GPU docs, and the 'mps' extra above for Apple silicon).
all = [
    "abtem[extra]",
    "abtem[gpaw]",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=7.0.0",
    "jupyterlab-code-formatter>=3.0.2",
    "mypy>=1.19.1",
    "nvidia-ml-py",
    "pre-commit>=4.5.1",
    "ruff>=0.15.0",
    "types-pyyaml>=6.0.12.20250915",
    "types-tqdm>=4.67.2.20260202",
]
docs = [
    "jupyter-book>=2.1.2",
    "sphinx-autodoc-typehints>=3.6.1",
]
test = [
    "deepdiff>=8.6.1",
    "hypothesis>=6.151.5",
    "imageio>=2.37.2",
    "jupyter-client>=8.8.0",
    "py>=1.11.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "sympy",
    "tox>=4.34.1",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages]
find = {namespaces = false}

[tool.setuptools.package-data]
abtem = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "abtem._version.__version__"}

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
fix = false
line-length = 88
exclude = [
    "abtem/reconstruct.py",
    "test",
    "*ipynb",
]

[tool.ruff.lint]
select = [
    "I",
    "E",
    "F",
    "W",
    "F821",
    #"ANN001",  # Missing type annotation for function argument
    #"ANN002",  # Missing type annotation for function return
    #"ANN003",  # Missing type annotation for variable
]
ignore = ["E741", "E743"]

[tool.pytest.ini_options]
# loadgroup is required for the `xdist_group("gpu")` marker conftest.py
# applies to every GPU-touching test to take effect; it's a no-op without
# -n/--numprocesses, so it's harmless for a plain, non-parallel `pytest` run.
addopts = "--dist=loadgroup"
filterwarnings = [
    "error",
    "ignore:Overspecified grid, the provided sampling:UserWarning",
    "ignore:module 'sre_parse' is deprecated:DeprecationWarning",
    "ignore:module 'sre_constants' is deprecated:DeprecationWarning",
    "ignore:Axis.*not supported by hyperspy.*:UserWarning",
    "ignore:'num_frozen_phonons' is greater than one, but the potential unit does not have frozen phonons:UserWarning",
    "ignore:ignoring keyword argument 'read_only':UserWarning",
    "ignore:Passing storage-related arguments:FutureWarning",
    "ignore:FNV hashing is not implemented in Numba:UserWarning",
    "ignore:ensemble_mean=False returns the full frozen-phonon ensemble:UserWarning",
    "ignore:.*Grid size.*will likely result in GPU under-utilization:numba.core.errors.NumbaPerformanceWarning",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    "ignore:cupyx.jit.rawkernel is experimental:FutureWarning",
    # PyTorch reports that an eigendecomposition too large for Metal's
    # threadgroup memory ran on the CPU instead. That is the right thing for it
    # to do and nothing for a test to fail over.
    "ignore:linalg.eigh:UserWarning",
    # Every single-precision Bloch-wave calculation warns about weak
    # intensities, which is most of them (float32 is the default, and Metal has
    # nothing else). The warning itself is asserted in test_bloch_waves.py.
    "ignore::abtem.bloch.BlochWavePrecisionWarning",
]

[tool.numpydoc_validation]
checks = [
    "all",  # report on all checks, except the below
    "EX01",
    "SA01",
    "ES01",
]
